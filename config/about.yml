HEADER:
  label: "About me"

PRESENTATION:
  description: |
    I'm a software engineer and team lead with over a decade of experience building real-time, high-performance systems and the low-level software layers that connect applications with physical hardware.

    At Win Systems I lead the development of an embedded software platform for regulated gaming hardware, owning core components such as rendering, mathematics and business logic, along with hardware drivers (NFC, addressable LEDs, printers, bill and coin acceptors). Earlier in my career I worked on real-time C++ applications at CIRSA and Digital Legends, and led a small team building and launching a mobile product end to end.

    My background bridges Computer Science and interactive systems engineering. I care about software that stays fast, reliable and maintainable as it grows — and about leading teams that build it well.

    Interests — Real-time systems · Software architecture · Performance optimization

